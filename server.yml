---
# A server, from the laptop: make server HOST=grem.ax. Clones this repo there from GitHub, so
# only what is pushed to master arrives. Packages (tmux, neovim, git, bash) are the server's
# own business.
- hosts: all
  vars:
    ansible_python_interpreter: auto_silent
  tasks:
    - name: Clone dotfiles
      ansible.builtin.git:
        repo: https://github.com/gremax/dotfiles.git
        dest: "{{ ansible_user_dir }}/.dotfiles"
        version: master

    - name: Symlink tmux configuration
      ansible.builtin.file:
        state: link
        src: "{{ ansible_user_dir }}/.dotfiles/files/tmux.conf"
        dest: "{{ ansible_user_dir }}/.tmux.conf"

    - name: Clone tmux plugin manager (TPM)
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ ansible_user_dir }}/.tmux/plugins/tpm"
        version: master

    # TPM's own installer needs a running tmux that has loaded the config, so clone the plugins
    # the way it would. The list follows the @plugin lines in files/tmux.conf.
    - name: Clone tmux plugins
      ansible.builtin.git:
        repo: "https://github.com/{{ item }}"
        dest: "{{ ansible_user_dir }}/.tmux/plugins/{{ item | basename }}"
      loop:
        - tmux-plugins/tmux-sensible
        - egel/tmux-gruvbox

    - name: Create config directory if it doesn't exist
      ansible.builtin.file:
        state: directory
        path: "{{ ansible_user_dir }}/.config"

    - name: Symlink Neovim server configuration
      ansible.builtin.file:
        state: link
        src: "{{ ansible_user_dir }}/.dotfiles/nvim-server"
        dest: "{{ ansible_user_dir }}/.config/nvim"
