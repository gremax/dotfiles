# agterm keymap — a kitty-flavored config for rebinding built-in shortcuts and defining
# custom shell commands. Edit this file and run File ▸ Reload Keymap (or `agtermctl keymap
# reload`) to apply. Blank lines and lines starting with `#` are ignored.
#
# Two verbs:
#
#   map <chord> <action>
#       Rebind a built-in action to a single chord (no leader sequences for built-ins).
#       Chords use kitty syntax: mods joined by `+`, e.g. `cmd+shift+d`, `ctrl+\``.
#       Mods: ctrl, cmd, opt, shift. Example:
#
#           map cmd+shift+d  toggle_split
#
#   command "<name>" [chord] <shell...>
#       Define a custom command, shown in the action palette marked `custom`. The quoted
#       name may contain spaces. An optional chord (single chord OR a leader like `ctrl+a>g`)
#       binds it to a key; the chord MUST include a modifier (a bare key is rejected and the
#       line becomes palette-only). Omit the chord for a palette-only command. The rest of the
#       line is run via `/bin/sh -c`. Examples:
#
#           command "Open in Zed"  cmd+shift+e  open -a Zed "$AGT_SESSION_PWD"
#           command "Lazygit"      ctrl+a>g     lazygit
#           command "Deploy"                    ./deploy.sh
#
# Built-in actions (raw name → shipped default chord):
#
#   new_window                  cmd+opt+n
#   rename_window               (no default)
#   delete_window               (no default)
#   new_workspace               cmd+shift+n
#   rename_workspace            (no default)
#   delete_workspace            (no default)
#   new_session                 cmd+n
#   open_directory              cmd+o
#   rename_session              (no default)
#   close_session               cmd+w
#   clear_status                (no default)
#   increase_font_size          (not expressible)
#   decrease_font_size          cmd+-
#   reset_font_size             cmd+0
#   toggle_split                cmd+d
#   toggle_scratch              cmd+j
#   toggle_search               cmd+f
#   toggle_sidebar              ctrl+cmd+s
#   select_theme                (no default)
#   toggle_flagged_view         (no default)
#   toggle_flag                 cmd+shift+f
#   focus_workspace             (no default)
#   focus_left_pane             (no default)
#   focus_right_pane            (no default)
#   previous_session            (no default)
#   next_session                (no default)
#   previous_attention_session  (no default)
#   next_attention_session      (no default)
#   first_session               (no default)
#   last_session                (no default)
#   quick_terminal              ctrl+`
#   session_palette             ctrl+p
#   command_palette             ctrl+shift+p
#   custom_command_palette      ctrl+shift+o
#
# Custom-command tokens (expanded in the shell line and exported as $AGT_X env vars):
#
#   {AGT_SESSION_ID}
#   {AGT_SESSION_NAME}
#   {AGT_SESSION_PWD}
#   {AGT_WORKSPACE_ID}
#   {AGT_WORKSPACE_NAME}
#   {AGT_WINDOW_ID}
#   {AGT_WINDOW_NAME}
#   {AGT_SELECTION}
#   {AGT_SOCKET}
#
# NOTE: a {AGT_X} token is substituted RAW into the /bin/sh line — convenient, but unsafe for
# content you don't control. {AGT_SELECTION} is the obvious case, but a remote host can also set
# the session title (OSC) and the working directory (OSC 7), so {AGT_SESSION_NAME} and
# {AGT_SESSION_PWD} are equally unsafe raw. For any such content prefer the matching $AGT_X
# environment variable, QUOTED, e.g. "$AGT_SELECTION".
#
# Uncomment and edit a line below to start.
# map cmd+shift+d toggle_split

# Cmd+1..9: jump to the Nth session of the active workspace (9 = last)
command "Session 1" cmd+1 ~/.config/agterm/scripts/goto-session.sh 1
command "Session 2" cmd+2 ~/.config/agterm/scripts/goto-session.sh 2
command "Session 3" cmd+3 ~/.config/agterm/scripts/goto-session.sh 3
command "Session 4" cmd+4 ~/.config/agterm/scripts/goto-session.sh 4
command "Session 5" cmd+5 ~/.config/agterm/scripts/goto-session.sh 5
command "Session 6" cmd+6 ~/.config/agterm/scripts/goto-session.sh 6
command "Session 7" cmd+7 ~/.config/agterm/scripts/goto-session.sh 7
command "Session 8" cmd+8 ~/.config/agterm/scripts/goto-session.sh 8
command "Last session" cmd+9 ~/.config/agterm/scripts/goto-session.sh 9

# Cmd+Shift+[ / ]: previous / next workspace
map cmd+shift+[ previous_workspace
map cmd+shift+] next_workspace

# Ctrl+Cmd+G: lazygit over the current session, in its directory
command "Lazygit" ctrl+cmd+g --error-hud ~/.config/agterm/scripts/lazygit.sh

# Ctrl+Cmd+H/J/K/L: vim-style navigation (thumb on cmd, pinky on caps-lock ctrl)
map ctrl+cmd+j next_session
map ctrl+cmd+k previous_session
map ctrl+cmd+h focus_left_pane
map ctrl+cmd+l focus_right_pane

# Ctrl+Cmd+M/I/C: long-lived TUI sessions in the "tui" workspace; press again to jump back
command "Mail" ctrl+cmd+m --error-hud ~/.config/agterm/scripts/tui-toggle.sh mail
command "IRC" ctrl+cmd+i --error-hud ~/.config/agterm/scripts/tui-toggle.sh irc
command "Calendar" ctrl+cmd+c --error-hud ~/.config/agterm/scripts/tui-toggle.sh cal

# Ctrl+Cmd+Y: yazi over the current session, in its directory
command "Yazi" ctrl+cmd+y --error-hud /Applications/agterm.app/Contents/MacOS/agtermctl session overlay open "/opt/homebrew/bin/fish -lc yazi" --cwd "$AGT_SESSION_PWD" --target "$AGT_SESSION_ID" --socket "$AGT_SOCKET"

# kitty-style hints: Ctrl+Cmd+U open a URL, Ctrl+Cmd+E open file:line in nvim, Ctrl+Cmd+B scrollback in nvim
command "Open URL" ctrl+cmd+u --error-hud ~/.config/agterm/scripts/hints-url.sh
command "Open path in nvim" ctrl+cmd+e --error-hud ~/.config/agterm/scripts/hints-path.sh
command "Scrollback in nvim" ctrl+cmd+b --error-hud ~/.config/agterm/scripts/scrollback.sh

# Ctrl+Cmd+/: cheat sheet of this keymap; press again (or Esc/q) to close
command "Shortcuts" ctrl+cmd+/ --error-hud ~/.config/agterm/scripts/shortcuts.sh

# Ctrl+Cmd+A: dashboard of agent panes, the ones waiting on you first; press again to close
command "Agents dashboard" ctrl+cmd+a --error-hud ~/.config/agterm/scripts/agents-dashboard.sh

# Ctrl+Opt+J/K: next / previous session that needs attention (agent waiting or done, new mail)
map ctrl+opt+j next_attention_session
map ctrl+opt+k previous_attention_session
